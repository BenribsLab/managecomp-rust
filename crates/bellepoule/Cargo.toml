[package]
name = "bellepoule"
description = "ManageComp : logiciel libre de gestion de compétitions d'escrime, dérivé de BellePoule"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "managecomp"
path = "src/main.rs"

[dependencies]
bp-core = { workspace = true }
bp-gtk = { workspace = true }
marshaller = { workspace = true }
bp-net = { workspace = true }
gtk4 = { workspace = true }
cairo-rs = { workspace = true }
glib = { workspace = true }
gio = { workspace = true }
roxmltree = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
zip = { workspace = true }
rand = { workspace = true }
ureq = { workspace = true }
serde_json = { workspace = true }
pangocairo = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[build-dependencies]
winresource = "0.1"
